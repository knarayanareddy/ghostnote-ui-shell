# Local development configuration (supabase start / supabase db reset).
# Regenerate with `supabase init` if the CLI introduces new defaults.
project_id = "jhlflndieocnpzsbsomv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true

# Required by the app: every visitor is an anonymous user.
[auth.anonymous]
enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
