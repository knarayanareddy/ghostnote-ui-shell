# Local development configuration (supabase start / supabase db reset).
#
# Key names follow Supabase CLI v2.30+/v3. Older 1.x CLIs used
# `[auth.anonymous] enabled = true` instead of
# `[auth] enable_anonymous_sign_ins = true`; note that an unknown block is
# silently ignored, so anonymous sign-ins would stay off. Verify with:
#   supabase init --force   # in a scratch dir, then diff the keys
project_id = "jhlflndieocnpzsbsomv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true
# Required by the app: every visitor is an anonymous user.
enable_anonymous_sign_ins = true

[auth.email]
enabled = true
double_confirm_changes = false
enable_confirmations = false

[auth.rate_limit]
# Anonymous sign-ins per hour per IP. The app creates one per browser, so this
# only matters for scripted abuse.
anonymous_users = 30
